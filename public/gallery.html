     display:none 토글은 애니메이션이 안 먹으니 opacity/visibility/transform으로 처리 */
  .login-dropdown{
    transform-origin:top right; opacity:0; visibility:hidden; pointer-events:none;

  .gallery-page-head{

  .gallery-thumb{

  footer{border-top:1px solid var(--line); padding:32px 0;}

          { id:"c2", author:"seulki.p", text:"감사합니다! 반영해서 다시 올려볼게요", createdAt:ohNowMinus(4*OH_DAY + 2*OH_HOUR) }

  function ohLoadPosts(){
    try{
      var raw = localStorage.getItem(OH_POSTS_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch(e){}
    var seeded = ohSeedPosts();
    ohSavePosts(seeded);
    return seeded;
  }
  function ohSavePosts(posts){
    try{ localStorage.setItem(OH_POSTS_KEY, JSON.stringify(posts)); } catch(e){}
  }
  function ohGetPost(id){
    var posts = ohLoadPosts();
    for (var i=0;i<posts.length;i++){ if (posts[i].id === id) return posts[i]; }
    return null;
  }
  function ohUpdatePost(id, mutator){
    var posts = ohLoadPosts();
    for (var i=0;i<posts.length;i++){
      if (posts[i].id === id){ mutator(posts[i]); break; }
    }
    ohSavePosts(posts);
    return posts;
  }
  function ohLikedSet(){
    try{
      var raw = JSON.parse(localStorage.getItem(OH_LIKED_KEY) || "[]");
      return Array.isArray(raw) ? raw : [];
    } catch(e){ return []; }
  }
  function ohIsLiked(id){ return ohLikedSet().indexOf(id) !== -1; }
  function ohToggleLiked(id){
    var liked = ohLikedSet();
    var idx = liked.indexOf(id);
    var nowLiked;
    if (idx === -1){ liked.push(id); nowLiked = true; }
    else { liked.splice(idx,1); nowLiked = false; }
    try{ localStorage.setItem(OH_LIKED_KEY, JSON.stringify(liked)); } catch(e){}
    return nowLiked;
  }
  function ohTimeAgo(iso){
    var diff = Date.now() - new Date(iso).getTime();
    var min = Math.floor(diff/60000);
    if (min < 1) return "방금 전";
    if (min < 60) return min + "분 전";
    var hr = Math.floor(min/60);
    if (hr < 24) return hr + "시간 전";
    var day = Math.floor(hr/24);
    if (day < 7) return day + "일 전";
    return new Date(iso).toLocaleDateString("ko-KR");
  }
  function ohEscapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function ohGetName(){
    try{ return (localStorage.getItem(OH_NAME_KEY) || "").trim(); } catch(e){ return ""; }
  }
  function ohSetName(name){
    try{ localStorage.setItem(OH_NAME_KEY, name); } catch(e){}
  }

  /* ---------- 갤러리 카드 렌더링 + 정렬/필터 ---------- */
  var CURRENT_FILTER = "all";
  var FILTER_ORDER = ["all", "expert", "recent", "popular"]; // .filter-bar 안의 칩 순서와 동일

  function ohMatchesFilter(post, filter){
    if (filter === "expert") return /전문가/.test(post.badge || "");
    return true;
  }
  function ohSortPosts(posts, filter){
    var arr = posts.slice();
    if (filter === "popular") arr.sort(function(a,b){ return (b.likes||0) - (a.likes||0); });
    else arr.sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); });
    return arr;
  }
  function ohRenderCard(post){
    var hasImg = !!(post.thumb && post.thumb.dataUrl);
    var thumbInner = hasImg
      ? '<img src="' + post.thumb.dataUrl + '" alt="">'
      : (OH_ICONS[(post.thumb && post.thumb.icon) || "house"] || OH_ICONS.house);
    var variant = (post.thumb && post.thumb.variant) || 1;
    var badge = post.badge ? '<span class="badge gallery-badge">' + ohEscapeHtml(post.badge) + '</span>' : "";
    var href = "/post?id=" + encodeURIComponent(post.id);
    return '' +
      '<article class="gallery-card">' +
        '<a class="gallery-thumb-link" href="' + href + '" aria-label="' + ohEscapeHtml(post.title) + ' 상세보기">' +
          '<div class="gallery-thumb' + (hasImg ? ' has-image' : '') + '" data-variant="' + variant + '">' + thumbInner + badge + '</div>' +
        '</a>' +
        '<div class="gallery-body">' +
          '<h3><a href="' + href + '">' + ohEscapeHtml(post.title) + '</a></h3>' +
          '<p class="gallery-user">' + ohEscapeHtml(post.author) + ' · ' + ohTimeAgo(post.createdAt) + '</p>' +
          '<div class="gallery-stats">' +
            '<span>' + OH_COMMENT_ICON + ' ' + ((post.comments && post.comments.length) || 0) + '</span>' +
            '<span>' + OH_LIKE_ICON + ' ' + (post.likes || 0) + '</span>' +
          '</div>' +
        '</div>' +
      '</article>';
  }
  function ohRenderGrid(){
    var grid = document.getElementById("galleryGrid");
    if (!grid) return;
    var posts = ohLoadPosts().filter(function(p){ return ohMatchesFilter(p, CURRENT_FILTER); });
    posts = ohSortPosts(posts, CURRENT_FILTER);
    grid.innerHTML = posts.length
      ? posts.map(ohRenderCard).join("")
      : '<p class="empty-msg" style="grid-column:1/-1;">해당하는 게시물이 아직 없어요.</p>';
  }

  /* 다크/라이트 모드 토글 — plan3d.html과 동일한 localStorage 키("oh-theme")를 공유해서
     두 페이지를 오가도 모드가 유지됨 */
  var SUN_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  var MOON_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1110.2 4a6.8 6.8 0 009.8 10.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
  var themeToggle = document.getElementById("themeToggle");
  var mql = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");

  function currentTheme(){
    var explicit = document.documentElement.getAttribute("data-theme");
    if (explicit === "light" || explicit === "dark") return explicit;
    return (mql && mql.matches) ? "dark" : "light";
  }
  function applyIcon(){
    themeToggle.innerHTML = currentTheme() === "dark" ? SUN_ICON : MOON_ICON;
  }
  themeToggle.addEventListener("click", function(){
    var next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("oh-theme", next); } catch(e){}
    applyIcon();
  });
  applyIcon();

  /* ---------- 상단 로그인 드롭다운 (백엔드 미연결 — 폼은 자리만 잡아둠) ---------- */
  (function(){
    var loginBtn = document.getElementById("loginBtn");
    var loginDropdown = document.getElementById("loginDropdown");
    var loginForm = document.getElementById("loginForm");
    if (!loginBtn || !loginDropdown) return;

    function isOpen(){ return loginDropdown.classList.contains("open"); }
    function setOpen(open){
      loginDropdown.classList.toggle("open", open);
      loginBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }
    loginBtn.addEventListener("click", function(e){
      e.stopPropagation();
      setOpen(!isOpen());
    });
    document.addEventListener("click", function(e){
      if (isOpen() && !loginDropdown.contains(e.target) && e.target !== loginBtn){
        setOpen(false);
      }
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && isOpen()) setOpen(false);
    });
    if (loginForm){
      loginForm.addEventListener("submit", function(e){
        e.preventDefault();
        // TODO: 로그인 API 연결 전까지는 제출해도 아무 동작 안 함
      });
    }
  })();

  /* 정렬 칩 — 전체/전문가 답변/최신순/인기순 실제로 갤러리 목록을 필터·정렬함 */
  var filterChips = document.querySelectorAll(".filter-bar .filter-chip");
  filterChips.forEach(function(chip, idx){
    chip.addEventListener("click", function(){
      filterChips.forEach(function(c){ c.classList.remove("is-active"); });
      chip.classList.add("is-active");
      CURRENT_FILTER = FILTER_ORDER[idx] || "all";
      ohRenderGrid();
    });
  });

  ohRenderGrid();
})();
</script>
